services:
  open-stt-server-cuda:
    image: ${OPEN_STT_CUDA_IMAGE:-open-stt-server:cuda}
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_BUILDER_IMAGE: ${OPEN_STT_CUDA_BUILDER_IMAGE:-nvidia/cuda}
        CUDA_BUILDER_IMAGE_TAG: ${OPEN_STT_CUDA_BUILDER_IMAGE_TAG:-12.4.1-devel-ubuntu22.04}
        CUDA_RUNTIME_IMAGE: ${OPEN_STT_CUDA_RUNTIME_IMAGE:-nvidia/cuda}
        CUDA_RUNTIME_IMAGE_TAG: ${OPEN_STT_CUDA_RUNTIME_IMAGE_TAG:-12.4.1-runtime-ubuntu22.04}
        CUDA_COMPUTE_CAP: ${CUDA_COMPUTE_CAP:-86}
    ports:
      - "127.0.0.1:${OPEN_STT_PORT:-8080}:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      OPEN_STT_PORT: "8080"
      OPEN_STT_MODELS: "${OPEN_STT_MODELS:-whisper-base}"
      OPEN_STT_DOWNLOAD: "${OPEN_STT_DOWNLOAD:-true}"
      OPEN_STT_DEFAULT_MODEL: "${OPEN_STT_DEFAULT_MODEL:-whisper-tiny}"
      OPEN_STT_FORCE_CPU: "${OPEN_STT_FORCE_CPU:-false}"
      RUST_LOG: "${RUST_LOG:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - cuda

  open-stt-server:
    image: ${OPEN_STT_IMAGE:-open-stt-server:debian}
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        RUST_DEV_IMAGE: ${RUST_DEV_IMAGE_BACKEND:-registry.hnrglobal.com/haydonryan/rust-dev-image}
        RUST_DEV_IMAGE_TAG: ${RUST_DEV_IMAGE_BACKEND_TAG:-latest}
    ports:
      - "127.0.0.1:${OPEN_STT_PORT:-8080}:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      OPEN_STT_PORT: "8080"
      OPEN_STT_MODELS: "${OPEN_STT_MODELS:-whisper-base}"
      OPEN_STT_DOWNLOAD: "${OPEN_STT_DOWNLOAD:-true}"
      OPEN_STT_DEFAULT_MODEL: "${OPEN_STT_DEFAULT_MODEL:-whisper-tiny}"
      OPEN_STT_FORCE_CPU: "${OPEN_STT_FORCE_CPU:-false}"
      OPEN_STT_API_KEY: "${OPEN_STT_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=backend
      - traefik.http.routers.open-stt.rule=Host(`${OPEN_STT_HOST:-stt.lab.hnrglobal.com}`)
      - traefik.http.routers.open-stt.entrypoints=websecure
      - traefik.http.routers.open-stt.tls=true
      - traefik.http.services.open-stt.loadbalancer.server.port=8080
    networks:
      - default
      - backend
    profiles:
      - debian
      - default

  open-stt-server-alpine:
    image: ${OPEN_STT_ALPINE_IMAGE:-open-stt-server:alpine}
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        RUST_ALPINE_IMAGE: ${OPEN_STT_ALPINE_BUILDER_IMAGE:-rust}
        RUST_ALPINE_IMAGE_TAG: ${OPEN_STT_ALPINE_BUILDER_IMAGE_TAG:-alpine}
        ALPINE_RUNTIME_IMAGE: ${OPEN_STT_ALPINE_RUNTIME_IMAGE:-alpine}
        ALPINE_RUNTIME_IMAGE_TAG: ${OPEN_STT_ALPINE_RUNTIME_IMAGE_TAG:-3.21}
    ports:
      - "127.0.0.1:${OPEN_STT_PORT:-8080}:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      OPEN_STT_PORT: "8080"
      OPEN_STT_MODELS: "${OPEN_STT_MODELS:-whisper-base}"
      OPEN_STT_DOWNLOAD: "${OPEN_STT_DOWNLOAD:-true}"
      OPEN_STT_DEFAULT_MODEL: "${OPEN_STT_DEFAULT_MODEL:-whisper-tiny}"
      OPEN_STT_FORCE_CPU: "${OPEN_STT_FORCE_CPU:-false}"
      OPEN_STT_API_KEY: "${OPEN_STT_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - alpine

volumes:
  hf_cache:
    driver: local

networks:
  backend:
    external: true
